services:
  - type: web
    name: topshot-user-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://topshot-backend.onrender.com
      - key: NODE_ENV
        value: production

